<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="320" height="690" viewBox="0 0 320 690">
<defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L0,6 L9,3 z" fill="#000" />
    </marker>
</defs>
<ellipse cx="160" cy="60" rx="100" ry="30" fill="#E6F3FF" stroke="#000" stroke-width="2"/>
<text x="160" y="60" font-family="Arial" font-size="14" text-anchor="middle" dominant-baseline="middle" fill="#000">Начало</text>

<line x1="160" y1="90" x2="160" y2="120" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="60" y="120" width="200" height="60" fill="#FFFFFF" stroke="#000" stroke-width="2"/>
<text x="160" y="150" font-family="Arial" font-size="14" text-anchor="middle" dominant-baseline="middle" fill="#000">x = 1</text>

<line x1="160" y1="180" x2="160" y2="210" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="60" y="210" width="200" height="60" fill="#FFFFFF" stroke="#000" stroke-width="2"/>
<text x="160" y="240" font-family="Arial" font-size="14" text-anchor="middle" dominant-baseline="middle" fill="#000">while (x &lt;= 5)</text>

<line x1="160" y1="270" x2="160" y2="300" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="60" y="300" width="200" height="60" fill="#FFFFFF" stroke="#000" stroke-width="2"/>
<text x="160" y="330" font-family="Arial" font-size="14" text-anchor="middle" dominant-baseline="middle" fill="#000">xSquared = Math.Pow(x, 2)</text>

<line x1="160" y1="360" x2="160" y2="390" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="60" y="390" width="200" height="60" fill="#FFFFFF" stroke="#000" stroke-width="2"/>
<text x="160" y="420" font-family="Arial" font-size="14" text-anchor="middle" dominant-baseline="middle" fill="#000">y = xSquared + 3 * x + 2</text>

<line x1="160" y1="450" x2="160" y2="480" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
<polygon points="85,480 260,480 235,540 60,540" fill="#F2F2F2" stroke="#000" stroke-width="2"/>
<text x="160" y="510" font-family="Arial" font-size="14" text-anchor="middle" dominant-baseline="middle" fill="#000">Вывод результат</text>

<line x1="160" y1="540" x2="160" y2="570" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
<ellipse cx="160" cy="600" rx="100" ry="30" fill="#E6F3FF" stroke="#000" stroke-width="2"/>
<text x="160" y="600" font-family="Arial" font-size="14" text-anchor="middle" dominant-baseline="middle" fill="#000">Конец</text>

</svg>
